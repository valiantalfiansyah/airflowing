[project]
name = "airflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.4.0",
]


[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
exclude = [
    ".ipynb",
    "fixtures/%",
    ".vscode/*",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true