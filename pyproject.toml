[project]
name = "airflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.4.0",
    "dbt-clickhouse>=1.10.3",
    "dbt-core>=1.12.7",
    "pydantic==2.14.2",
]


[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "sqlfluff>=4.5.0",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "*.ipynb",
    "fixtures/*"
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["AIR", "TID251", "S608"]

[tool.ruff.lint.per-file-ignores]
"dags/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"airflow".msg = "pipelines/ must stay Airflow-free; import Airflow only in dags/ or tests/."

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 120
rules = "all"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"
